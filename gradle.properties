# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

# Set the Gradle JVM options (adjust the heap size as needed)
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Enable Gradle Daemon for faster builds
org.gradle.daemon=true

# Enable parallel task execution for better performance
org.gradle.parallel=true

# Enable build caching (useful for faster incremental builds)
org.gradle.caching=true

# Set the default logging level
# org.gradle.logging.level=info

# Rich console output (colorful and progress bars)
org.gradle.console=verbose

# Prefer HTTPS for dependencies
org.gradle.internal.http.connectionTimeout=60
org.gradle.internal.http.socketTimeout=60
org.gradle.repository.ssl.verify=true

org.gradle.configuration-cache=true

